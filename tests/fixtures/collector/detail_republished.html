<h1>重庆市住房和城乡建设委员会关于印发城市生命线安全工程实施方案的通知</h1>
<span class="date">2026-08-21</span>
<div class="content">
为贯彻落实城市生命线安全工程建设要求，现印发本实施方案。方案明确提出建设基础设施风险监测能力，
推动物联感知平台建设，加快数据治理与数字化转型，鼓励采用人工智能技术开展风险预警。
各区县住建部门要结合实际制定专项方案，积极申请专项资金支持平台建设与系统升级改造。
</div>
