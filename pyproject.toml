[project]
name = "opportunity-platform"
version = "0.1.0"
description = "AI 商务机会发现与行业专家研判平台"
authors = [
    { name = "Zumin Li", email = "zumin.li.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
    "redis>=5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = [
    "B008", # Depends(...) in a default arg is the standard FastAPI DI idiom
]
